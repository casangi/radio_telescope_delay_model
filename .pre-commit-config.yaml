# The packaged CALC data files are binary / byte-exact reference data; the
# whitespace fixers corrupted DE421_little_Endian once by treating it as text.
# The difxcalc11 patch is excluded for the same reason: its context lines must
# match the pristine submodule sources byte-for-byte (trailing blanks
# included) or the patch stops applying.
exclude: ^src/radio_telescope_delay_model/(data/|delay_model_cpp/patches/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--chars,"  "]

  - repo: https://github.com/asottile/pyupgrade
    rev: v2.38.2
    hooks:
      - id: pyupgrade
        args:
          - --py311-plus

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff-check        # linter (incl. import sorting via the I rules)
        args: [--fix]
      - id: ruff-format       # formatter (black replacement)

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
