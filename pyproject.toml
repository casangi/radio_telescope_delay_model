[project]
name = "radio_telescope_delay_model"
version = "0.1.1"
description = "Radio telescope delay model: uvw and delays via CALC11 and astropy"
authors = [{ name = "Jan-Willem Steeb", email = "jsteeb@nrao.edu" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11,<3.15"

dependencies = [
  "numpy",
  "astropy",
]

[project.optional-dependencies]
all = [
  "pytest",
  "pytest-cov",
  "pytest-html",
  "pre-commit",
]

[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
build.verbose = true
cmake.build-type = "Release"
# Pin the Fortran optimisation exactly to the CALC11 reference build (-O2):
# with CMake's default Release "-O3" ahead of the per-source -O2 the resulting
# objects differed from the reference by a few ULPs in the geometric delay.
cmake.args = ["-DCMAKE_Fortran_FLAGS_RELEASE=-O2"]
wheel.packages = ["src/radio_telescope_delay_model"]
# The difxcalc11 Fortran lives in the DiFX submodule's worktree, which is not
# tracked by this repo's git index -- include it explicitly or sdists cannot
# build the _difxcalc11_ext extension.
sdist.include = [
  "src/radio_telescope_delay_model/data/*",
  "extern/difx/applications/difxcalc11/src/*",
]

[tool.cibuildwheel]
# Compiled package (C++23 + two Fortran cores): wheels are per-platform and
# per-Python (used by .github/workflows/python-publish.yml). Every wheel must
# pass the unit tests before upload -- bit parity is per-toolchain, so the
# pinned difxcalc11 values and the EHT-archive comparison in tests/unit are
# the acceptance criterion for a CI-built wheel.
# CPython 3.12-3.14 (the VIPER-wide set; no free-threaded builds).
build = "cp312-* cp313-* cp314-*"
skip = "*-musllinux*"
build-verbosity = 1
test-requires = "pytest"
test-command = "python -m pytest {project}/tests/unit -q"
# These images ship the gcc-toolset (C++23-capable gcc + gfortran); auditwheel
# bundles libgfortran/libquadmath into the wheel.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# AppleClang (>= the C++23 floor on current runners) compiles the C++; the
# Fortran cores use Homebrew's gfortran-14 (the workflow installs gcc@14).
# The deployment target matches the runner OS so delocate accepts the brew
# libgfortran it bundles into the wheel: Homebrew bottles gcc@14 for the
# runner's own macOS, so its libgfortran/libquadmath have that minimum
# version. The publish workflow pins the runner to macos-15 for this reason
# (macos-latest is macOS 26, whose bottle needs 26.0); bump both together.
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0", FC = "gfortran-14" }

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Same rule set as the other VIPER packages (see astroviper's pyproject):
#   E4/E7/E9 -- pycodestyle errors; F -- pyflakes; B -- bugbear;
#   UP -- pyupgrade; I -- import sorting.
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"example_notebooks/*" = ["E702", "B905"]
